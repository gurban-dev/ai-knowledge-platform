packages:
  - "apps/*"
  - "packages/*"

peerDependencyRules:
  allowedVersions:
    typescript: "5"

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  # Nest Swagger telemetry helper — no need to run its install script.
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
