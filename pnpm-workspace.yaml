packages:
  - "apps/*"
  - "packages/*"

peerDependencyRules:
  allowedVersions:
    typescript: "5"

allowBuilds:
  '@nestjs/core': set this to true or false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': set this to true or false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
